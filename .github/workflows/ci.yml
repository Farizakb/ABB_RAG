name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: abb, POSTGRES_PASSWORD: abb, POSTGRES_DB: abb }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://abb:abb@localhost:5432/abb
      EMBEDDING_DIM: "1536"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e backend/shared -e backend/scraper -e backend/rag -e backend/chat -r requirements-dev.txt -r backend/rag/requirements.txt -r backend/chat/requirements.txt
      - run: ruff format --check . && ruff check . && mypy
      - run: |
          set -e
          for f in db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -v dim="$EMBEDDING_DIM" -f "$f"
          done
      - run: pytest
      # Plumbing smoke test: no corpus is ingested and --mock returns a fixed answer,
      # so rows scored on generated text (fact/enumeration asserts, small talk) can't
      # pass by design. The rest still run the real migrations and hybrid retrieval SQL.
      - run: |
          set -e
          python -c "
          import json, pathlib
          items = [json.loads(l) for l in pathlib.Path('evals/golden.jsonl').read_text('utf-8').splitlines() if l.strip()]
          safe = [it for it in items if not (it.get('fact_assert') or it.get('enumeration_assert') or it.get('type') == 'small_talk')]
          pathlib.Path('/tmp/golden_ci_smoke.jsonl').write_text('\n'.join(json.dumps(it) for it in safe[:10]) + '\n', encoding='utf-8')
          "
          python evals/runner.py --golden /tmp/golden_ci_smoke.jsonl --mock --out /tmp/report.md

# apps/web/nginx.conf
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 8m;   # the corpus upload is ~1.1 MB; nginx defaults to 1m

  location /api/v1/corpora { proxy_pass http://rag:8000; proxy_read_timeout 120s; }
  location /api/v1/        { proxy_pass http://chat:8000; }
  location /               { try_files $uri /index.html; }
}

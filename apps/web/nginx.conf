# apps/web/nginx.conf
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 8m;   # the corpus upload is ~1.1 MB; nginx defaults to 1m

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/v1/corpora {
    proxy_pass http://rag:8000;
    proxy_read_timeout 120s;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, not $proxy_add_x_forwarded_for: there is no CDN/load balancer
    # in front of this nginx, so there is no legitimate inbound X-Forwarded-For
    # chain to preserve, and appending would let a client seed its own value
    # (this would be wrong behind a real CDN, where the inbound chain is trusted).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }
  location /api/v1/ {
    proxy_pass http://chat:8000;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, not $proxy_add_x_forwarded_for: there is no CDN/load balancer
    # in front of this nginx, so there is no legitimate inbound X-Forwarded-For
    # chain to preserve, and appending would let a client seed its own value
    # (this would be wrong behind a real CDN, where the inbound chain is trusted).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }
  location / { try_files $uri /index.html; }
}
